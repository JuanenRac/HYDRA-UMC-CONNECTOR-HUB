<title id="t">HYDRA-UMC-CONNECTOR-HUB architecture</title>
<desc id="d">HYDRA-UMC-CONNECTOR-HUB is a registry of adapter manifests for external machines. It validates each manifest against one contract, serves the catalogue read only, passes a requested capability through the real evaluate_job gate of HYDRA-UMC-SDK and records a human-attested certification in a hash-chained log. It never touches a machine: it has no network write path and does not check the evidence against real hardware.</desc>
