name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          lint: full
      - name: Run the test suite (with the SDK extra, so the safety-gate tests run)
        run: |
          # the [sdk] extra is installed too: without it the 31 SDK-gate tests are skipped
          python -m pip install ".[dev,sdk]"
          PYTHONPATH=src python -m pytest tests -q -rs
