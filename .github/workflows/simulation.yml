# Runs the real health probes of the hub against simulated machines on loopback (a broker, an OPC UA server, a vehicle that streams MAVLink, a controller with a declared exchange, a web endpoint) that fail on command. No hardware. See docs/SIMULATION.md.
# It runs on every push and pull request, by hand, and once a week.
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

jobs:
  simulation:
    name: Run the simulated scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run the scenarios
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_simulation_bench.py -v
